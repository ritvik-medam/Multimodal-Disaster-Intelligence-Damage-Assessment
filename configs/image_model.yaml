architecture: efficientnet_b2
pretrained: true
num_classes: null           # filled automatically from dataset
image_size: 224
batch_size: 32
epochs: 50
learning_rate: 0.0001
weight_decay: 0.01
patience: 7                 # early stopping patience
min_delta: 0.001
label_smoothing: 0.1
use_mixup: true
mixup_alpha: 0.2

# Data
dataset_name: medic         # medic | crisismmd_image | both
data_dir: data/processed/image_classifier
splits_dir: data/splits/image_classifier

# Augmentation
augmentation:
  random_horizontal_flip: true
  random_rotation: 15
  color_jitter: true
  random_erasing: true

# Hardware
device: auto               # auto | cuda | mps | cpu
num_workers: 4
pin_memory: true
mixed_precision: false     # Set true only if CUDA + stable

# Checkpoints
checkpoint_dir: models/disaster_classifier
save_best_only: true
checkpoint_metric: val_f1_macro

# Logging
log_interval: 10
log_dir: logs/image_classifier

# Reproducibility
seed: 42
